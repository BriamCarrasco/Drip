name: drip

services:
  app:
    build: .
    image: drip
    container_name: drip
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - drip-data:/app/data
    restart: unless-stopped

volumes:
  drip-data:
